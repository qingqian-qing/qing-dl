name: Sync APK from upstream

on:
  schedule:
    - cron: '0 4 * * *'      # 每天北京时间 12:00
  workflow_dispatch:          # 也能手动点

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_apks.py

      - name: Commit version state
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/versions.json
          git diff --staged --quiet || git commit -m 'chore: 更新 APK 版本记录'
          git push || true
